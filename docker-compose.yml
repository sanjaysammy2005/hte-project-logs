# TraceLock development environment: PostgreSQL + FastAPI backend + Vite React frontend.
# Usage: copy .env.example to .env, then `docker compose up --build`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created: creates the tracelock_test database.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/tracelock_test
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      TRACELOCK_LAB_ENABLED: ${TRACELOCK_LAB_ENABLED:-false}
      TRACELOCK_STORAGE_ROOT: /var/lib/tracelock/files
      TRACELOCK_MAX_UPLOAD_BYTES: ${TRACELOCK_MAX_UPLOAD_BYTES:-26214400}
      TRACELOCK_ALLOWED_EXTENSIONS: ${TRACELOCK_ALLOWED_EXTENSIONS:-txt,pdf,doc,docx,ppt,pptx,xls,xlsx,csv,jpg,jpeg,png}
      # File-change events do not cross Windows bind mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      # File contents (never inside the source tree, never served statically).
      - filestore:/var/lib/tracelock/files
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine localhost resolves to ::1 but Vite listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  filestore:
